name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-e2e:
    name: E2E Acceptance Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install eBPF & Kernel Tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang llvm libelf-dev libbpf-dev \
            linux-tools-common linux-tools-generic linux-tools-$(uname -r)

      - name: Generate vmlinux.h from Kernel BTF
        run: |
          sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c | sudo tee /usr/include/vmlinux.h > /dev/null
          ls -lh /usr/include/vmlinux.h

      - name: Run End-to-End Test Suite
        run: |
          make test-e2e

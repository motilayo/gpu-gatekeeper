name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          echo "Building linux/amd64 binary..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/ggate-agent-linux-amd64 ./cmd/ggate-agent
          echo "Building linux/arm64 binary..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/ggate-agent-linux-arm64 ./cmd/ggate-agent

      - name: Package Helm Chart
        run: |
          helm package deploy/helm/ggate -d dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true

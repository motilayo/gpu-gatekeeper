apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ggate-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ggate-agent
    app.kubernetes.io/part-of: gpu-gatekeeper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ggate-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggate-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      hostNetwork: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ggate-agent
          image: ghcr.io/motilayo/gpu-gatekeeper:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/ggate-agent
            - --libcuda=/host/usr/lib/x86_64-linux-gnu/libcuda.so.1
            - --metrics-addr=:9090
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_ADMIN
                - SYS_PTRACE
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: host-libcuda
              mountPath: /host/usr/lib/x86_64-linux-gnu/libcuda.so.1
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: host-libcuda
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libcuda.so.1

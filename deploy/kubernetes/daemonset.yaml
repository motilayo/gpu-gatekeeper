apiVersion: v1
kind: ServiceAccount
metadata:
  name: ggate-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ggate-agent
    app.kubernetes.io/part-of: gpu-gatekeeper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ggate-agent
  labels:
    app.kubernetes.io/name: ggate-agent
    app.kubernetes.io/part-of: gpu-gatekeeper
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaimtemplates", "deviceclasses", "resourceslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ggate-agent
  labels:
    app.kubernetes.io/name: ggate-agent
    app.kubernetes.io/part-of: gpu-gatekeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ggate-agent
subjects:
  - kind: ServiceAccount
    name: ggate-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ggate-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ggate-agent
    app.kubernetes.io/part-of: gpu-gatekeeper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ggate-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggate-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ggate-agent
      hostPID: true
      hostNetwork: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ggate-agent
          image: ghcr.io/motilayo/gpu-gatekeeper:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/ggate-agent
            - --libcuda=auto
            - --metrics-addr=:9090
            - --kubelet-pods-url=https://127.0.0.1:10250/pods
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_ADMIN
                - SYS_PTRACE
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: nvidia-driver
              mountPath: /run/nvidia/driver
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: nvidia-driver
          hostPath:
            path: /run/nvidia/driver
            type: DirectoryOrCreate
